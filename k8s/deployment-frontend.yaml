apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-support-frontend
  namespace: customer-support
  labels:
    app: customer-support
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-support
      component: frontend
  template:
    metadata:
      labels:
        app: customer-support
        component: frontend
    spec:
      containers:
      - name: frontend
        image: customer-support-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.taskflow.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: customer-support-frontend
  namespace: customer-support
  labels:
    app: customer-support
    component: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: customer-support
    component: frontend
