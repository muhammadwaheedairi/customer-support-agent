apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-support-backend
  namespace: customer-support
  labels:
    app: customer-support
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customer-support
      component: backend
  template:
    metadata:
      labels:
        app: customer-support
        component: backend
    spec:
      containers:
      - name: backend
        image: customer-support-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: customer-support-config
        - secretRef:
            name: customer-support-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: customer-support-backend
  namespace: customer-support
  labels:
    app: customer-support
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: customer-support
    component: backend
